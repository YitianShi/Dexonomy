services:
  dexonomy:
    user: vscode
    command: /bin/bash -lc "while sleep 1000; do :; done"
    environment:
      HOME: /home/vscode
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/container.xauth
      MUJOCO_GL: glfw
    volumes:
      - .:/workspace:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - type: bind
        source: /tmp/dexonomy-devcontainer.xauth
        target: /tmp/container.xauth
        read_only: true
        bind:
          # Do not let Docker turn a missing auth file into a directory.
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
